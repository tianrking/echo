name: Compare recorded Echo native benchmarks
on:
  push:
    branches: [codex/echo-native-validation]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27.1'
          cache: true
      - name: Compare unchanged recorded measurements
        run: |
          mkdir -p evidence
          sha256sum native-benchmark-inputs/*.txt > evidence/input-sha256.txt
          go install golang.org/x/perf/cmd/benchstat@v0.0.0-20260929162123-406019bb8b68
          go version -m "$(command -v benchstat)" > evidence/benchstat-version.txt
          benchstat -table=goos,goarch,pkg,cpu -row=.fullname -col=.file native-benchmark-inputs/benchmark-original.txt native-benchmark-inputs/benchmark-fixed.txt | tee evidence/benchstat-comparison.txt
          test "${PIPESTATUS[0]}" -eq 0
          cp native-benchmark-inputs/*.txt evidence/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: echo-native-benchmark-comparison
          path: evidence/
          if-no-files-found: error
