name: Echo exact source native verification
on:
  push:
    branches: [codex/echo-native-validation]
permissions:
  contents: read
env:
  SOURCE_SHA: f6051c1c9c844d35c88776fa45a3e657480f7c24
  BASE_SHA: 99c395d846e079d4cffd29de9298d1dd829e8b04
jobs:
  full:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        go: ['1.25', '1.27']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Literal original focused replay
        run: |
          mkdir -p evidence
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum group.go group_notfound_test.go > evidence/source-sha256.txt
          go version > evidence/go-version.txt
          git show "$BASE_SHA:group.go" > group.go
          sha256sum group.go > evidence/original-production-sha256.txt
          set +e
          go test -json -count=1 -run '^TestGroupUse' . 2>&1 | tee evidence/original-focused.jsonl
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > evidence/original-focused-exit.txt
          test "$result" -eq 1
          python3 - <<'PY'
          import json
          events = [json.loads(line) for line in open('evidence/original-focused.jsonl') if line.startswith('{')]
          results = {e['Test']: e['Action'] for e in events if e.get('Test') and e['Action'] in ('pass', 'fail', 'skip')}
          assert results.get('TestGroupUsePreservesNotFoundHandler') == 'fail', results
          assert results.get('TestGroupUseNotFoundOverHTTP') == 'fail', results
          assert results.get('TestGroupUseNotFoundWithAutoRegistrationDisabled') == 'pass', results
          assert results.get('TestGroupUseDoesNotRestoreRemovedNotFoundHandler') == 'pass', results
          assert not any(v == 'skip' for v in results.values()), results
          json.dump(results, open('evidence/original-test-results.json', 'w'), indent=2)
          PY
          git restore --source=HEAD -- group.go
          sha256sum -c evidence/source-sha256.txt
      - name: Exact source full race and coverage
        run: |
          set +e
          go test -json -race -count=1 -coverprofile=evidence/coverage.out -covermode=atomic ./... 2>&1 | tee evidence/full-race.jsonl
          result=${PIPESTATUS[0]}
          set -e
          echo "$result" > evidence/full-race-exit.txt
          test "$result" -eq 0
          go list ./... > evidence/packages.txt
          sha256sum -c evidence/source-sha256.txt
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: echo-exact-full-go-${{ matrix.go }}
          path: evidence/
          if-no-files-found: error
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27'
          cache: true
      - name: Install official quality tools and record versions
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum group.go group_notfound_test.go > evidence/source-sha256.txt
          go version > evidence/go-version.txt
          make init 2>&1 | tee evidence/tool-install.log
          go install golang.org/x/vuln/cmd/govulncheck@latest 2>&1 | tee -a evidence/tool-install.log
          go version -m "$(command -v golint)" > evidence/tool-versions.txt
          go version -m "$(command -v staticcheck)" >> evidence/tool-versions.txt
          go version -m "$(command -v govulncheck)" >> evidence/tool-versions.txt
      - name: Quality checks with full package enumeration
        run: |
          check_command() {
            case "$1" in
              make-check) make check ;;
              golint) golint -set_exit_status ./... ;;
              staticcheck) staticcheck ./... ;;
              vet) go vet ./... ;;
              short) go test -short -count=1 ./... ;;
              govulncheck) govulncheck ./... ;;
            esac
          }
          set +e
          go list github.com/labstack/echo/... > evidence/make-package-list.txt 2>&1
          echo "$?" > evidence/make-package-list.exit
          set -e
          go list ./... > evidence/full-package-list.txt
          for check in make-check golint staticcheck vet short govulncheck; do
            set +e
            check_command "$check" 2>&1 | tee "evidence/$check.log"
            result=${PIPESTATUS[0]}
            set -e
            echo "$result" > "evidence/$check.exit"
          done
          gofmt -l group.go group_notfound_test.go > evidence/changed-gofmt.txt
          test ! -s evidence/changed-gofmt.txt
          sha256sum -c evidence/source-sha256.txt
          git diff --exit-code
          for check in make-check golint staticcheck vet short govulncheck; do
            if test "$(cat "evidence/$check.exit")" -ne 0; then
              git worktree add --detach baseline "$BASE_SHA"
              set +e
              (cd baseline && check_command "$check") > "evidence/baseline-$check.log" 2>&1
              result=$?
              set -e
              echo "$result" > "evidence/baseline-$check.exit"
              git worktree remove baseline
            fi
          done
          for check in make-check golint staticcheck vet short govulncheck; do
            test "$(cat "evidence/$check.exit")" -eq 0
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: echo-exact-quality
          path: evidence/
          if-no-files-found: error
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: '1.27'
          cache: true
      - name: Original and exact source benchmark comparison
        run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/source-sha.txt
          sha256sum group.go group_notfound_test.go > evidence/source-sha256.txt
          go version > evidence/go-version.txt
          git worktree add --detach baseline "$BASE_SHA"
          set +e
          (cd baseline && go test -run='-' -benchmem -bench='.*' -benchtime=100ms -count=8 ./...) > evidence/benchmark-original.txt 2>&1
          result=$?
          set -e
          echo "$result" > evidence/benchmark-original.exit
          test "$result" -eq 0
          set +e
          go test -run='-' -benchmem -bench='.*' -benchtime=100ms -count=8 ./... > evidence/benchmark-fixed.txt 2>&1
          result=$?
          set -e
          echo "$result" > evidence/benchmark-fixed.exit
          test "$result" -eq 0
          go install golang.org/x/perf/cmd/benchstat@latest
          go version -m "$(command -v benchstat)" > evidence/benchstat-version.txt
          benchstat evidence/benchmark-original.txt evidence/benchmark-fixed.txt | tee evidence/benchstat.txt
          sha256sum -c evidence/source-sha256.txt
          git diff --exit-code
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: echo-exact-benchmark
          path: evidence/
          if-no-files-found: error
